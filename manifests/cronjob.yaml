apiVersion: batch/v1
kind: CronJob
metadata:
  name: rss-syncer
  namespace: rss-feed-to-instapaper
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: bhcr-secret
          containers:
            - name: syncer
              image: devops.bighaus.app/rss-feed-to-instapaper/rss-syncer:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: instapaper-credentials
              volumeMounts:
                - name: state
                  mountPath: /data
                - name: config
                  mountPath: /config
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: rss-syncer-state
            - name: config
              configMap:
                name: rss-syncer-config
                items:
                  - key: config.yaml
                    path: config.yaml
